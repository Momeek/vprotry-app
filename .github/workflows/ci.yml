name: vprofile CI Pipeline

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  build:
    if: github.event_name == 'pull_request'
    name: PR validation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Maven dependency cache for build, Sonar and Trivy
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.sonar/cache
            ~/.cache/trivy
          key: ${{ runner.os }}-mvn-sonar-trivy-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-mvn-sonar-trivy-

      - name: Maven clean build and unit tests
        run: mvn -B clean verify

      - name: Run Checkstyle
        run: mvn -B checkstyle:checkstyle

      - name: SonarQube scan
        uses: sonarsource/sonarqube-scan-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

      - name: SonarQube quality gate
        uses: sonarsource/sonarqube-quality-gate-action@v1.1.0
        with:
          scanMetadataReportFile: .scannerwork/report-task.txt
        env:
          GITHUB_TOKEN: ${{ vars.SONAR_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  docker-build-push:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    name: Build and push Docker image to ECR
    runs-on: ubuntu-latest
    needs: []
    outputs:
      registry: ${{ steps.ecr-login.outputs.registry }}
      image_tag: ${{ steps.image-meta.outputs.image_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.CI_AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image metadata
        id: image-meta
        shell: bash
        run: |
          echo "image_tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        shell: bash
        run: |
          IMAGE_REGISTRY="${{ steps.ecr-login.outputs.registry }}"
          IMAGE_NAME="${IMAGE_REGISTRY}/${{ vars.ECR_REPOSITORY }}"
          docker build -f Docker-files/app/multistage/Dockerfile -t "$IMAGE_NAME:${{ steps.image-meta.outputs.image_tag }}" -t "$IMAGE_NAME:latest" .

      - name: Trivy image scan and save vulnerability report
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: image
          image-ref: ${{ steps.ecr-login.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ steps.image-meta.outputs.image_tag }}
          format: table
          output: vprofile-trivy-image-report.txt
          severity: HIGH,CRITICAL
          exit-code: "0"

      - name: Upload Trivy image report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vprofile-trivy-image-report
          path: vprofile-trivy-image-report.txt
          if-no-files-found: error

      - name: Push Docker image to ECR
        shell: bash
        run: |
          IMAGE_REGISTRY="${{ steps.ecr-login.outputs.registry }}"
          IMAGE_NAME="${IMAGE_REGISTRY}/${{ vars.ECR_REPOSITORY }}"
          docker push "$IMAGE_NAME:${{ steps.image-meta.outputs.image_tag }}"
          docker push "$IMAGE_NAME:latest"

  helm-update:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    name: Update Helm values in GitOps repo
    runs-on: ubuntu-latest
    needs: docker-build-push
    steps:
      - name: Checkout Helm repository
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.HELM_REPO_USER }}/${{ vars.HELM_REPO_NAME }}
          token: ${{ secrets.GITOPS_PAT }}
          path: helm-repo

      - name: Install yq
        shell: bash
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.45.1/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Update values.yaml image and tag
        working-directory: helm-repo
        env:
          ECR_IMAGE: ${{ needs.docker-build-push.outputs.registry }}/${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ needs.docker-build-push.outputs.image_tag }}
        shell: bash
        run: |
          if [ ! -f "helm/vprofile/values.yaml" ]; then
            echo "Missing Helm values file at helm/vprofile/values.yaml"
            exit 1
          fi
          yq -i '.app.image = env(ECR_IMAGE) | .app.tag = env(IMAGE_TAG)' helm/vprofile/values.yaml

      - name: Commit and push Helm update
        working-directory: helm-repo
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/vprofile/values.yaml
          if git diff --cached --quiet; then
            echo "No Helm changes required."
            exit 0
          fi
          git commit -m "Update app image for ${{ needs.docker-build-push.outputs.image_tag }}"
          git push origin HEAD:main

  notify:
    if: always()
    name: Slack notification
    runs-on: ubuntu-latest
    needs:
      - build
      - docker-build-push
      - helm-update
    steps:
      - name: Send Slack status
        shell: bash
        env:
          SLACK_WEBHOOK: ${{ vars.SLACK_WEBHOOK_URL }}
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            STATUS="${{ needs.build.result }}"
            MESSAGE="PR validation for ${GITHUB_REPOSITORY} on ${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}} ${STATUS}."
          elif [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            STATUS="${{ needs.helm-update.result }}"
            MESSAGE="Main branch deployment for ${GITHUB_REPOSITORY} completed with ${STATUS}. Image: ${{ needs.docker-build-push.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ needs.docker-build-push.outputs.image_tag }}"
          else
            STATUS="skipped"
            MESSAGE="Workflow skipped for ${GITHUB_REPOSITORY} on ${GITHUB_REF_NAME}."
          fi

          if [[ "$STATUS" == "success" ]]; then
            EMOJI="✅"
          elif [[ "$STATUS" == "failure" ]]; then
            EMOJI="❌"
          else
            EMOJI="ℹ️"
          fi

          curl -sS -X POST -H 'Content-Type: application/json' \
            --data '{"text":"'"$EMOJI $MESSAGE"'"}' \
            "$SLACK_WEBHOOK"
